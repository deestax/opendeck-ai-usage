name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s opendeck-claude-usage/tests -v
      - run: cargo build --release --workspace --locked
      - run: python3 -m unittest discover -s tests -v
      - run: cargo run --locked -p opendeck-style --example bridge_smoke
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: opendeck-ai-usage-linux-x86_64
          path: dist/*.zip
