[package]
name = "opendeck-style"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/deestax/opendeck-ai-usage"

[dependencies]
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
time = { version = "0.3", features = ["parsing"] }
