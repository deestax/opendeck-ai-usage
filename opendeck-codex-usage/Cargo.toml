[package]
name = "opendeck-codex-usage"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/deestax/opendeck-ai-usage"

[dependencies]
opendeck-style = { path = "../opendeck-style" }
openaction = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
log = "0.4"
simplelog = "0.12"
base64 = "0.22"
